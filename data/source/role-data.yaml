  mapped: true
- number: 2.2.2
  slug: pause-stop-hide
  name: Pause, Stop, Hide
  level: A
  principle: Operable
  guideline: 2.2 Enough Time
  normativeUrl: https://www.w3.org/TR/WCAG22/#pause-stop-hide
