  principle: Understandable
  guideline: 3.3 Input Assistance
  normativeUrl: https://www.w3.org/TR/WCAG22/#accessible-authentication-minimum
  understandingUrl: https://www.w3.org/WAI/WCAG22/Understanding/accessible-authentication-minimum.html
  versions:
  - '2.2'
  summary: 'A cognitive function test (such as remembering a password or solving a puzzle) is not required for any step in an authentication process unless that step provides at least one of the following:'
  arrmResponsibilities: {}
  criterionSummaryStatus: missing
  inBrief:
    goal: Make logins possible with less mental effort.
    whatToDo: Don't make people solve, recall, or transcribe something to log in.
    whyImportant: Some people with cognitive disabilities cannot solve puzzles, memorize a username and password, or retype one-time passcodes.
  mapped: true
- number: 3.3.9
  slug: accessible-authentication-enhanced
  name: Accessible Authentication (Enhanced)
  level: AAA
  principle: Understandable
  guideline: 3.3 Input Assistance
  normativeUrl: https://www.w3.org/TR/WCAG22/#accessible-authentication-enhanced
  understandingUrl: https://www.w3.org/WAI/WCAG22/Understanding/accessible-authentication-enhanced.html
  versions:
  - '2.2'
  summary: 'A cognitive function test (such as remembering a password or solving a puzzle) is not required for any step in an authentication process unless that step provides at least one of the following:'
  arrmResponsibilities: {}
  criterionSummaryStatus: missing
  inBrief:
    goal: Make logins possible with less mental effort.
    whatToDo: Don't make people recognize objects or user-supplied images and media to login.
    whyImportant: Some people with cognitive disabilities can't do puzzles, including identifying objects and non-text information they previously supplied.
  mapped: true
- number: 4.1.2
  slug: name-role-value
  name: Name, Role, Value
  level: A
  principle: Robust
  guideline: 4.1 Compatible
  normativeUrl: https://www.w3.org/TR/WCAG22/#name-role-value
  understandingUrl: https://www.w3.org/WAI/WCAG22/Understanding/name-role-value.html
  versions:
  - '2.0'
  - '2.1'
  - '2.2'
  summary: 'For all user interface components (including but not limited to: form elements, links and components generated by scripts), the name and role can be programmatically determined; states, properties, and values that can be set by the user can be programmatically set; and notification of changes to these items is available to user agents, including assistive technologies.'
  arrmResponsibilities:
    Content Authoring:
    - contributor
    User Experience (UX) Design:
    - primary
    - secondary
    Front-End Development:
    - primary
  criterionSummaryStatus: recorded
  inBrief:
    goal: People using assistive technology understand all components.
    whatToDo: Give components appropriate names, roles, states, and values.
    whyImportant: Assistive technology only works well when code is done properly.
  mapped: true
- number: 4.1.3
  slug: status-messages
  name: Status Messages
  level: AA
  principle: Robust
  guideline: 4.1 Compatible
  normativeUrl: https://www.w3.org/TR/WCAG22/#status-messages
  understandingUrl: https://www.w3.org/WAI/WCAG22/Understanding/status-messages.html
  versions:
  - '2.1'
  - '2.2'
  summary: In content implemented using markup languages, status messages can be programmatically determined through role or properties such that they can be presented to the user by assistive technologies without receiving focus.
  arrmResponsibilities:
    User Experience (UX) Design:
    - primary
    - secondary
    Front-End Development:
    - primary
    - secondary
  criterionSummaryStatus: recorded
  inBrief:
    goal: Make users aware of important changes in content.
    whatToDo: Let assistive technology notify users about status changes that don't take focus.
    whyImportant: People who do not see messages need to be informed about them.
  mapped: true
