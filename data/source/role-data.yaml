    Visual Design:
    - secondary
    User Experience (UX) Design:
    - primary
    - secondary
    Front-End Development:
    - primary
  criterionSummaryStatus: recorded
  inBrief:
    goal: Everything can be done with a keyboard except freehand movements.
    whatToDo: Ensure pointer actions have a keyboard equivalent.
    whyImportant: Many people rely on the keyboard interface, including blind and some mobility impaired people.
  mapped: true
- number: 2.1.2
  slug: no-keyboard-trap
  name: No Keyboard Trap
  level: A
  principle: Operable
  guideline: 2.1 Keyboard Accessible
  normativeUrl: https://www.w3.org/TR/WCAG22/#no-keyboard-trap
