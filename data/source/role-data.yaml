  mapped: true
- number: 2.5.8
  slug: target-size-minimum
  name: Target Size (Minimum)
  level: AA
  principle: Operable
  guideline: 2.5 Input Modalities
  normativeUrl: https://www.w3.org/TR/WCAG22/#target-size-minimum
