  mapped: true
- number: 2.5.6
  slug: concurrent-input-mechanisms
  name: Concurrent Input Mechanisms
  level: AAA
  principle: Operable
  guideline: 2.5 Input Modalities
  normativeUrl: https://www.w3.org/TR/WCAG22/#concurrent-input-mechanisms
