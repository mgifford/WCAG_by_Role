    whyImportant: People who rely on the keyboard often have no other means to navigate.
  mapped: true
- number: 2.1.3
  slug: keyboard-no-exception
  name: Keyboard (No Exception)
  level: AAA
  principle: Operable
  guideline: 2.1 Keyboard Accessible
  normativeUrl: https://www.w3.org/TR/WCAG22/#keyboard-no-exception
  understandingUrl: https://www.w3.org/WAI/WCAG22/Understanding/keyboard-no-exception.html
  versions:
  - '2.0'
  - '2.1'
  - '2.2'
  summary: All functionality of the content is operable through a keyboard interface without requiring specific timings for individual keystrokes.
  arrmResponsibilities:
    User Experience (UX) Design:
    - primary
    Front-End Development:
    - secondary
  criterionSummaryStatus: recorded
  inBrief:
    goal: Everything can be done with a keyboard.
    whatToDo: Ensure all pointer actions have a keyboard equivalent.
