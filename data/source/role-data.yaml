  versions:
  - '2.1'
  - '2.2'
  summary: Web content does not restrict use of input modalities available on a platform except where the restriction is essential, required to ensure the security of the content, or required to respect user settings.
  arrmResponsibilities:
    User Experience (UX) Design:
    - primary
    Front-End Development:
    - secondary
  criterionSummaryStatus: recorded
  inBrief:
    goal: Users can choose different ways of inputting content.
    whatToDo: Do not prevent users from switching their mode of input.
    whyImportant: People may not be able to work using just one input method.
  mapped: true
- number: 2.5.7
  slug: dragging-movements
  name: Dragging Movements
  level: AA
  principle: Operable
  guideline: 2.5 Input Modalities
  normativeUrl: https://www.w3.org/TR/WCAG22/#dragging-movements
