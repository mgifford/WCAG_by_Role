  principle: Operable
  guideline: 2.5 Input Modalities
  normativeUrl: https://www.w3.org/TR/WCAG22/#target-size-enhanced
  understandingUrl: https://www.w3.org/WAI/WCAG22/Understanding/target-size-enhanced.html
  versions:
  - '2.1'
  - '2.2'
  summary: 'The size of the target for pointer inputs is at least 44 by 44 CSS pixels except when:'
  arrmResponsibilities:
    Visual Design:
    - primary
  criterionSummaryStatus: recorded
  inBrief:
