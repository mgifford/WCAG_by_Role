  mapped: true
- number: 2.5.4
  slug: motion-actuation
  name: Motion Actuation
  level: A
  principle: Operable
  guideline: 2.5 Input Modalities
  normativeUrl: https://www.w3.org/TR/WCAG22/#motion-actuation
