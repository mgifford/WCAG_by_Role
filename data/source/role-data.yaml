    Visual Design:
    - primary
    - secondary
    User Experience (UX) Design:
    - primary
    - secondary
    Front-End Development:
    - contributor
  criterionSummaryStatus: recorded
  inBrief:
    goal: Make controls easier to activate.
    whatToDo: Ensure targets meet a minimum size or have sufficient spacing around them.
