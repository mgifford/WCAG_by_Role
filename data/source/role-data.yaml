- number: 2.5.2
  slug: pointer-cancellation
  name: Pointer Cancellation
  level: A
  principle: Operable
  guideline: 2.5 Input Modalities
  normativeUrl: https://www.w3.org/TR/WCAG22/#pointer-cancellation
  understandingUrl: https://www.w3.org/WAI/WCAG22/Understanding/pointer-cancellation.html
  versions:
  - '2.1'
  - '2.2'
  summary: 'For functionality that can be operated using a single pointer, at least one of the following is true:'
  arrmResponsibilities:
    User Experience (UX) Design:
    - primary
  criterionSummaryStatus: recorded
  inBrief:
    goal: Reduce accidental activation of controls by mouse or touch.
    whatToDo: Make pointer cancellation predictable and consistent.
    whyImportant: Make it easier for anyone to recover from something they didn’t mean to do.
  mapped: true
- number: 2.5.3
  slug: label-in-name
  name: Label in Name
  level: A
  principle: Operable
  guideline: 2.5 Input Modalities
  normativeUrl: https://www.w3.org/TR/WCAG22/#label-in-name
