schemaVersion: 1.0.0
id: user-experience-design
language: en
profileStatus: project-draft
authority: Independent project communication profile, not W3C guidance.
arrmRole: User Experience (UX) Design
title: UX designers
perspective: User journeys, interaction design, recovery paths, affordances and research.
voice: User-centred, scenario-driven, concise; describe flows and their observable effects.
preferredTerms:
- user journey
- interaction
- flow
- feedback
- discoverability
- prototype
- error recovery
- navigation
- research
avoidUnexplained:
- DOM
- aria-describedby
- CSS selector
- network payload
focusQuestions:
- How does this work across an interaction?
- What happens when the expected path fails?
- How will disabled users test it?
deliverables:
- interaction specification
- annotated prototype
- flow diagram
- usability finding
verificationExamples:
- keyboard walkthrough
- usability research with disabled participants
roleBoundary: A prototype or specified interaction does not establish implemented accessibility.
ownershipCommunication:
  primary: Describe the task the role is normally accountable for, using the source assignment unchanged.
  secondary: Describe how the role supports the primary owner without taking over responsibility.
  contributor: Describe consultation and input; do not imply implementation accountability.
  none: State explicitly that ARRM records no task-level ownership for this role; optional context
    is not an assignment.
editorialRules:
- Do not change WCAG requirements or conformance levels.
- Do not infer ARRM ownership from criterion-level summaries.
- Make uncertainty explicit.
- Prefer platform-neutral examples unless a platform is specifically required.
- Do not stereotype professional knowledge, disability, or reading ability.
personaRef: ../personas/ux-uma.yaml
