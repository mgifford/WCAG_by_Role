$schema: https://json-schema.org/draft/2020-12/schema
title: WCAG by Role fictional professional persona
type: object
required:
- schemaVersion
- personaType
- researchStatus
- id
- roleSlug
- arrmRole
- name
- summary
- scenario
- goals
- needs
- thoughts
- feelings
- behaviors
- painPoints
- preferredCommunication
- avatar
- sourceNotes
properties:
  schemaVersion:
    type: string
  personaType:
    const: fictional-professional-archetype
  researchStatus:
    enum:
    - unvalidated-draft
    - in-review
    - validated
    - revision-required
  id:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  roleSlug:
    enum:
    - business-analysis
    - content-authoring
    - user-experience-design
    - visual-design
    - front-end-development
  arrmRole:
    type: string
    minLength: 2
  name:
    type: string
  shortName:
    type: string
  summary:
    type: string
  scenario:
    type: string
  goals:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 2
  needs:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 2
  thoughts:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 2
  feelings:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 2
  behaviors:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 2
  painPoints:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 2
  accessContext:
    type: string
  avatar:
    type: object
    required:
    - provider
    - seed
    - set
    - url
    - localPath
    - format
    - size
    - decorative
    - altText
    - license
    - attribution
    - assetStatus
    - sha256
    - genre
    properties:
      provider:
        const: RoboHash
      seed:
        type: string
        minLength: 10
      set:
        const: set1
      url:
        type: string
        pattern: ^https://robohash\.org/
      localPath:
        type: string
      format:
        const: png
      size:
        const: 400x400
      assetStatus:
        enum:
        - not-downloaded
        - cached
      sha256:
        type:
        - string
        - 'null'
        pattern: ^[0-9a-f]{64}$
      decorative:
        const: true
      altText:
        const: ''
      license:
        type: string
      attribution:
        type: string
      genre:
        const: classic-robot
  sourceNotes:
    type: object
    required:
    - inspiredBy
    - claims
  preferredCommunication:
    type: object
    required:
    - vocabulary
    - framing
    - exampleTypes
    - explainTerms
    - successSignal
    properties:
      vocabulary:
        type: array
        items:
          type: string
      framing:
        type: string
      exampleTypes:
        type: array
        items:
          type: string
      explainTerms:
        type: array
        items:
          type: string
      successSignal:
        type: string
    additionalProperties: false
additionalProperties: false
