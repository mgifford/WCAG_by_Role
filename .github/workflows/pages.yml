name: Build and deploy WCAG by Role

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly refresh of the upstream W3C and ARRM sources.
    - cron: '17 5 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build and audit the offline demo
        run: python3 scripts/pipeline.py --mode demo

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install browser-test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run filter matrix tests
        run: pnpm test:filters

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright and axe-core tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  production:
    name: Production import and audit
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build from live W3C and ARRM sources
        run: python3 scripts/pipeline.py --mode production

      - name: Record provenance and audit artefact
        uses: actions/upload-artifact@v7
        with:
          name: import-audit
          path: |
            dist/data/role-data.json
            dist/data/import-audit.json
          retention-days: 14

      - name: Upload GitHub Pages artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Smoke test deployed site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify live production artefact
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python3 scripts/smoke_site.py --url "$SMOKE_URL" --wait 90
